<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptive Text Adventure</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config for Custom Colors/Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            deep: '#1e3a8a',   // Deep blue
                            sky: '#38bdf8',    // Sky blue
                            teal: '#2dd4bf',   // Turquoise

                            yellow: '#facc15', // Yellow
                            orange: '#fdba74', // Soft orange
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for 3D Game Aesthetic and Animations -->
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #333;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Button Styles */
        .btn-3d {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-radius: 1rem;
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }

        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        .btn-3d:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: none !important;
        }

        .btn-primary {
            background-color: #facc15;
            color: #854d0e;
            box-shadow: 0 6px 0 #ca8a04, 0 8px 12px rgba(0, 0, 0, 0.25);
            border: 2px solid #fef08a;
        }
        .btn-primary:hover:not(:disabled) { background-color: #fde047; }

        .btn-secondary {
            background-color: #38bdf8;
            color: #0c4a6e;
            box-shadow: 0 6px 0 #0284c7, 0 8px 12px rgba(0, 0, 0, 0.25);
            border: 2px solid #bae6fd;
        }
        .btn-secondary:hover:not(:disabled) { background-color: #7dd3fc; }

        .btn-success {
            background-color: #2dd4bf;
            color: #134e4a;
            box-shadow: 0 6px 0 #0d9488, 0 8px 12px rgba(0, 0, 0, 0.25);
            border: 2px solid #99f6e4;
        }
        .btn-success:hover:not(:disabled) { background-color: #5eead4; }

        .btn-purple {
            background-color: #a855f7;
            color: #ffffff;
            box-shadow: 0 6px 0 #7e22ce, 0 8px 12px rgba(0, 0, 0, 0.25);
            border: 2px solid #d8b4fe;
        }
        .btn-purple:hover:not(:disabled) { background-color: #c084fc; }

        .btn-danger {
            background-color: #f87171;
            color: #450a0a;
            box-shadow: 0 6px 0 #dc2626;
            border: 2px solid #fca5a5;
        }
        .btn-danger:hover:not(:disabled) { background-color: #fca5a5; }

        /* Card Styles */
        .game-card {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 0 #cbd5e1, 0 16px 24px rgba(0, 0, 0, 0.22);
            border: 4px solid #f8fafc;
            overflow: hidden;
        }

        /* Drag & Drop Visuals */
        .drop-zone {
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            transform: scale(1.02);
            border-color: #38bdf8 !important;
            background-color: #f0f9ff !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }
        .drag-chip {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .drag-chip:active {
            cursor: grabbing;
            transform: scale(0.97);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes starSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.18); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .star-spin { animation: starSpin 0.9s ease-in-out; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =========================================================================
        // 1. COURSE & GROUP 4 CREDITS DATA (FROM PPT)
        // =========================================================================
        const COURSE_INFO = {
            courseTitle: "Technology and Teaching and Learning L2 Writing",
            materialTitle: "Descriptive Text: People, Animals, Things, and Place",
            tagline: "LOOK – DISCOVER – DESCRIBE – CREATE",
            lecturer: "Dr. Venny Eka Meidasari, S.Pd., M.Hum",
            groupName: "Group 4",
            members: [
                { name: "Mingga Ria Hadi", nim: "20257470071" },
                { name: "Rizka Radiana", nim: "20257470085" },
                { name: "Nurlatifah", nim: "20257470133" },
                { name: "Gina Raisah", nim: "20257470075" }
            ],
            workflow: ["1. Plan", "2. Draft", "3. Respond", "4. Revise", "5. Reflect"]
        };

        // =========================================================================
        // 2. REALISTIC IMAGES (GOOGLE DRIVE) + INLINE SVG FALLBACK FOR ALL 4 WORLDS
        // =========================================================================
        const TOPIC_DRIVE_IMAGES = {
            people: {
                id: '1Ic1Yy4eWr4H1sO5RYnXuLvyGx9AmUCaF',
                alt: 'Descriptive Text About People'
            },
            things: {
                id: '1Cid3CTPYcAmjdrjQW-CTae0EafsDhDkn',
                alt: 'Descriptive Text About Thing'
            },
            animals: {
                id: '1G8-D5bkNB8aErr7TVjR7PGmDNG4bJl2H',
                alt: 'Descriptive Text About Animal'
            },
            place: {
                id: '1Khaojt2woeQK0miGRq_jIzK8jKFoONYd',
                alt: 'Descriptive Text About Place'
            }
        };

        const TopicIllustration = ({ topicId, className = "w-full h-56" }) => {
            const [imgAttempt, setImgAttempt] = useState(0);
            const driveInfo = TOPIC_DRIVE_IMAGES[topicId];

            useEffect(() => {
                setImgAttempt(0);
            }, [topicId]);

            if (driveInfo && imgAttempt < 3) {
                const src = imgAttempt === 0
                    ? `https://drive.google.com/thumbnail?id=${driveInfo.id}&sz=w1000`
                    : imgAttempt === 1
                    ? `https://lh3.googleusercontent.com/d/${driveInfo.id}`
                    : `https://drive.google.com/uc?export=view&id=${driveInfo.id}`;

                return (
                    <img
                        src={src}
                        alt={driveInfo.alt}
                        referrerPolicy="no-referrer"
                        onError={() => setImgAttempt(prev => prev + 1)}
                        className={`${className} object-cover bg-slate-100`}
                    />

            }

            if (topicId === 'people') {
                // Hermione Granger: long brown curly hair, brown eyes, pointed nose, oval face, white shirt, tie, black sweater

                        {/* Back curly brown hair */}

                        <circle cx="218" cy="120" r="18" fill="#5c341c"/>
                        <circle cx="100" cy="152" r="19" fill="#6b3f23"/>
                        <circle cx="220" cy="152" r="19" fill="#6b3f23"/>
                        {/* Body: Black Sweater */}

                        <polygon points="184,152 170,165 174,150" fill="#f1f5f9"/>

                        <line x1="155" y1="174" x2="165" y2="174" stroke="#facc15" strokeWidth="3"/>
                        <line x1="154" y1="188" x2="166" y2="188" stroke="#facc15" strokeWidth="3"/>
                        <line x1="154" y1="202" x2="166" y2="202" stroke="#facc15" strokeWidth="3"/>
                        {/* Neck */}
                        <rect x="150" y="132" width="20" height="22" rx="8" fill="#fbd3b6"/>
                        {/* Oval Face */}
                        <ellipse cx="160" cy="98" rx="38" ry="44" fill="#fde0c8"/>

                        </defs>

                        {/* Fluffy Body */}
                        <ellipse cx="168" cy="148" rx="52" ry="38" fill="#ffffff" stroke="#e2e8f0" strokeWidth="3"/>
                        {/* Four Short Legs */}
                        <rect x="128" y="168" width="16" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2"/>
                        <rect x="148" y="172" width="16" height="22" rx="8" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="2"/>
                        <rect x="180" y="172" width="16" height="22" rx="8" fill="#f8fafc" stroke="#cbd5e1" strokeWidth="2"/>
                        <rect x="198" y="168" width="16" height="24" rx="8" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2"/>
                        {/* Two Small Ears */}
                        <polygon points="108,76 116,44 138,66" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2"/>
                        <polygon points="114,72 119,52 132,67" fill="#fbcfe8"/>
                        <polygon points="178,76 170,44 148,66" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2"/>
                        <polygon points="172,72 167,52 154,67" fill="#fbcfe8"/>
                        {/* Fluffy Head */}
                        <circle cx="143" cy="96" r="38" fill="#ffffff" stroke="#e2e8f0" strokeWidth="3"/>
                        {/* Two Beautiful Round Eyes */}
                        <circle cx="129" cy="92" r="8" fill="#38bdf8"/>
                        <circle cx="129" cy="92" r="4.5" fill="#0f172a"/>
                        <circle cx="131" cy="89" r="2" fill="#ffffff"/>
                        <circle cx="157" cy="92" r="8" fill="#38bdf8"/>
                        <circle cx="157" cy="92" r="4.5" fill="#0f172a"/>
                        <circle cx="159" cy="89" r="2" fill="#ffffff"/>

                        {/* Toy Ball */}
                        <circle cx="72" cy="182" r="14" fill="#fb923c" stroke="#ea580c" strokeWidth="2"/>
                        <path d="M62 174 Q72 182 82 190" stroke="#fef08a" strokeWidth="2.5" fill="none"/>
                        <text x="260" y="45" fontSize="22">🐾</text>
                    </svg>
                );
            }

            if (topicId === 'things') {
                // My Red Car: red body, 4 black tires (2 visible + 2 shadow), 4 doors, 2 big headlights, large windshield, comfortable seats
                return (
                    <svg viewBox="0 0 320 220" className={className} xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgCar" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#e0f2fe"/>
                                <stop offset="70%" stopColor="#f8fafc"/>
                                <stop offset="70%" stopColor="#94a3b8"/>
                                <stop offset="100%" stopColor="#64748b"/>
                            </linearGradient>
                        </defs>
                        <rect width="320" height="220" rx="20" fill="url(#bgCar)"/>
                        {/* Road dashes */}
                        <line x1="20" y1="194" x2="70" y2="194" stroke="#facc15" strokeWidth="4" strokeDasharray="16 12"/>
                        <line x1="110" y1="194" x2="200" y2="194" stroke="#facc15" strokeWidth="4" strokeDasharray="16 12"/>
                        <line x1="240" y1="194" x2="300" y2="194" stroke="#facc15" strokeWidth="4" strokeDasharray="16 12"/>
                        {/* Car Shadow */}
                        <ellipse cx="160" cy="176" rx="118" ry="12" fill="#1e293b" opacity="0.35"/>
                        {/* Car Cabin Roof */}
                        <path d="M88 108 L116 68 C124 58, 198 58, 212 68 L244 108 Z" fill="#dc2626" stroke="#991b1b" strokeWidth="2"/>
                        {/* Large Windshield & Side Windows with Comfortable Seats */}
                        <path d="M98 106 L122 74 L162 74 L162 106 Z" fill="#bae6fd" stroke="#0284c7" strokeWidth="2"/>
                        <path d="M168 74 L208 74 L232 106 L168 106 Z" fill="#bae6fd" stroke="#0284c7" strokeWidth="2"/>
                        {/* Comfortable Seats inside */}
                        <rect x="132" y="88" width="16" height="18" rx="4" fill="#78350f"/>
                        <rect x="182" y="88" width="16" height="18" rx="4" fill="#78350f"/>
                        {/* Main Red Car Body */}

                        <circle cx="228" cy="166" r="24" fill="#1e293b" stroke="#0f172a" strokeWidth="3"/>
                        <circle cx="228" cy="166" r="11" fill="#cbd5e1"/>
                        <text x="36" y="46" fontSize="22">✨</text>

                <svg viewBox="0 0 320 220" className={className} xmlns="http://www.w3.org/2000/svg">

                        <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#38bdf8"/>
                            <stop offset="100%" stopColor="#bae6fd"/>

                        <linearGradient id="bgSea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#0284c7"/>
                            <stop offset="100%" stopColor="#2dd4bf"/>

                    {/* Bright Sun */}
                    <circle cx="268" cy="44" r="22" fill="#facc15"/>
                    <circle cx="268" cy="44" r="28" fill="#fef08a" opacity="0.4"/>
                    {/* Clouds */}
                    <ellipse cx="82" cy="40" rx="26" ry="12" fill="#ffffff" opacity="0.9"/>
                    <ellipse cx="102" cy="36" rx="18" ry="10" fill="#ffffff" opacity="0.9"/>
                    <ellipse cx="182" cy="52" rx="20" ry="9" fill="#ffffff" opacity="0.85"/>
                    {/* Blue Seawater */}
                    <rect x="0" y="106" width="320" height="58" fill="url(#bgSea)"/>
                    {/* Big Waves */}

                    <path d="M18 148 Q58 134 98 148 T180 148 T260 148 T320 148" stroke="#ffffff" strokeWidth="3.5" fill="none" strokeLinecap="round" opacity="0.85"/>

                    {/* Beach Umbrella */}
                    <line x1="252" y1="198" x2="258" y2="156" stroke="#78350f" strokeWidth="3.5"/>
                    <path d="M226 158 Q258 134 290 158 Z" fill="#ef4444"/>

                    <text x="160" y="206" textAnchor="middle" fontSize="12" fontWeight="900" fill="#92400e">KUTA BEACH – BALI, INDONESIA</text>
                </svg>
            );
        };

        // =========================================================================
        // 3. FOUNDATION MATERIALS (BASE CAMP)
        // =========================================================================
        const MATERIAL_CONTENT = {
            def: {
                title: "What is Descriptive Text?",
                content: "Descriptive text is a text that describes a particular person, animal, thing, or place in detail.",
                function: "To describe a particular person, animal, thing, or place so readers can clearly imagine its characteristics.",
                icon: "📖"
            },
            structure: {
                title: "Generic Structure",
                icon: "🏗️",
                parts: [
                    {
                        name: "1. IDENTIFICATION",
                        desc: "Introducing the person, animal, thing, or place being described.",
                        example: "Kuta Beach is a famous beach located in Bali, Indonesia."
                    },
                    {
                        name: "2. DESCRIPTION",
                        desc: "Describing physical appearance, personality, characteristics, what you see, or what you feel.",
                        example: "Kuta Beach is a beautiful place with blue seawater, sandy beaches, big waves, and a beautiful blue sky."
                    }
                ]
            },
            lang: {

        // =========================================================================
        const ScreenDragDropSorter = ({ world, showModal, onBack, onComplete }) => {
            const shuffledInitial = useMemo(() => {
                return [...world.sortItems].sort(() => Math.random() - 0.5);
            }, [world.id]);

            const [bank, setBank] = useState(shuffledInitial);
            const [boxes, setBoxes] = useState(() => {
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                return init;
            });
            const [selectedItem, setSelectedItem] = useState(null); // For tap-to-place mobile UX
            const [dragOverCat, setDragOverCat] = useState(null);
            const [checkedStatus, setCheckedStatus] = useState(null); // null or map of itemId -> boolean

            useEffect(() => {
                setBank([...world.sortItems].sort(() => Math.random() - 0.5));
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                setBoxes(init);
                setSelectedItem(null);
                setCheckedStatus(null);
            }, [world.id]);

            const moveItemToCategory = (itemId, targetCatId) => {
                setCheckedStatus(null);
                // Find item either in bank or in another box
                let item = bank.find(i => i.id === itemId);
                let newBank = [...bank];
                const newBoxes = {};
                world.categories.forEach(c => { newBoxes[c.id] = [...boxes[c.id]]; });

                if (item) {
                    newBank = newBank.filter(i => i.id !== itemId);
                } else {
                    for (const catId of Object.keys(newBoxes)) {
                        const found = newBoxes[catId].find(i => i.id === itemId);
                        if (found) {
                            item = found;
                            newBoxes[catId] = newBoxes[catId].filter(i => i.id !== itemId);
                            break;
                        }
                    }
                }

                if (!item) return;

                if (targetCatId === 'bank') {
                    newBank.push(item);
                } else {
                    newBoxes[targetCatId].push(item);
                }

                setBank(newBank);
                setBoxes(newBoxes);
                setSelectedItem(null);
            };

            const handleDragStart = (e, itemId) => {
                e.dataTransfer.setData('text/plain', itemId);
                setSelectedItem(itemId);
            };

            const handleDrop = (e, targetCatId) => {
                e.preventDefault();
                setDragOverCat(null);
                const itemId = e.dataTransfer.getData('text/plain') || selectedItem;
                if (itemId) moveItemToCategory(itemId, targetCatId);
            };

            const handleReset = () => {
                setBank([...world.sortItems].sort(() => Math.random() - 0.5));
                const init = {};

                setSelectedItem(null);
                setCheckedStatus(null);

                if (bank.length > 0) {

                    return;
                }

                const statusMap = {};
                let correctCount = 0;
                world.categories.forEach(cat => {
                    boxes[cat.id].forEach(item => {
                        const isRight = item.category === cat.id;
                        statusMap[item.id] = isRight;
                        if (isRight) correctCount++;
                    });

                setCheckedStatus(statusMap);

                if (correctCount === world.sortItems.length) {
                    showModal(
                        "Awesome Job! 🌟",
                        `You sorted all ${correctCount} phrases about ${world.subjectTitle} into the correct boxes!`,
                        "success",
                        onComplete
                    );

                    showModal(
                        "Keep Trying! 🔍",
                        `You got ${correctCount} out of ${world.sortItems.length} correct. Red cards are in the wrong box—drag or tap them to move them!`,
                        "error"
                    );
                }

                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-4">

                                ⬅️ Back to {world.name}
                            </button>
                            <span className={`text-xs font-black px-3 py-1.5 rounded-full border ${world.badgeColor}`}>
                                🧲 Interactive Vocabulary Sorter • {world.subjectTitle}
                            </span>
                        </div>

                        <div className="game-card p-5 md:p-6 animate-pop space-y-5">
                            {/* Header + Picture */}
                            <div className="flex flex-col md:flex-row items-center gap-5 bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                <div className="w-full md:w-56 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-brand-deep">Drag & Drop Into the Right Box!</h2>
                                    <p className="text-sm font-bold text-slate-600 mt-1">
                                        Look at the picture of <span className="text-brand-deep">{world.subjectTitle}</span>. Drag each phrase from the list below into the empty category boxes.
                                    </p>
                                    <p className="text-xs font-bold text-blue-600 mt-1">
                                        💡 Petunjuk: Seret kartu ke kotak kategori, atau klik kartu lalu klik kotak tujuannya (ramah layar sentuh!).
                                    </p>
                                </div>
                            </div>

                            {/* Empty Category Drop Boxes */}
                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                                {world.categories.map(cat => (
                                    <div
                                        key={cat.id}
                                        onDragOver={(e) => { e.preventDefault(); setDragOverCat(cat.id); }}
                                        onDragLeave={() => setDragOverCat(null)}
                                        onDrop={(e) => handleDrop(e, cat.id)}
                                        onClick={() => { if (selectedItem) moveItemToCategory(selectedItem, cat.id); }}
                                        className={`drop-zone rounded-2xl border-4 border-dashed min-h-[210px] flex flex-col overflow-hidden ${cat.color} ${
                                            dragOverCat === cat.id ? 'drag-over' : ''
                                        } ${selectedItem ? 'cursor-pointer ring-2 ring-brand-sky/60' : ''}`}
                                    >
                                        <div className={`${cat.headerBg} text-white font-black px-4 py-2.5 flex justify-between items-center`}>
                                            <span>{cat.icon} {cat.label}</span>

                                        </div>

                                            {boxes[cat.id].length === 0 ? (
                                                <div className="flex-1 flex items-center justify-center text-slate-400 font-bold text-sm text-center p-4">
                                                    {selectedItem ? "Tap here to drop selected card!" : "Empty box — Drop phrases here"}
                                                </div>
                                            ) : (
                                                boxes[cat.id].map(item => {
                                                    const status = checkedStatus ? checkedStatus[item.id] : null;
                                                    return (
                                                        <div
                                                            key={item.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, item.id)}
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                moveItemToCategory(item.id, 'bank');
                                                            }}
                                                            title="Drag to move or click to return to bank"
                                                            className={`drag-chip px-3 py-2 rounded-xl font-bold text-sm shadow-sm border-2 flex justify-between items-center gap-2 ${
                                                                status === true ? 'bg-green-100 border-green-500 text-green-900' :
                                                                status === false ? 'bg-red-100 border-red-500 text-red-900' :
                                                                'bg-white border-slate-200 text-slate-800 hover:border-brand-sky'
                                                            }`}
                                                        >
                                                            <span>{item.text}</span>
                                                            <span className="text-xs opacity-60 shrink-0">
                                                                {status === true ? '✅' : status === false ? '❌' : '↩️'}
                                                            </span>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Shuffled Word/Phrase Bank */}
                            <div
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={(e) => handleDrop(e, 'bank')}
                                className="bg-slate-100 rounded-2xl p-4 border-2 border-slate-300"
                            >
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-slate-700 text-sm uppercase">
                                        📦 Phrase List ({bank.length} remaining)
                                    </h3>
                                    {selectedItem && (
                                        <span className="text-xs font-black text-blue-600 animate-pulse">
                                            Card selected! Tap a box above to drop it.

                                    <p className="text-center text-green-600 font-black py-3">
                                        🎉 All cards placed! Click "CHECK ANSWERS" below.

                                    <div className="flex flex-wrap gap-2">
                                        {bank.map(item => (
                                            <button

                                                draggable
                                                onDragStart={(e) => handleDragStart(e, item.id)}

        // =========================================================================
        // 12. STAGE 3: GRAMMAR DETECTIVE (TOPIC-ALIGNED & FINAL BOSS)
        // =========================================================================
        const ScreenGrammar = ({ data, title = "Grammar Detective", world = null, onBack, onComplete, showModal, isFinal = false }) => {
            const [currentQ, setCurrentQ] = useState(0);

            useEffect(() => { setCurrentQ(0); }, [data]);

            const handleAnswer = (index) => {
                const q = data[currentQ];
                if (index === q.correct) {
                    showModal("Correct! 🎯", q.exp || "Great grammar detective work!", "success", () => {
                        nextQuestion();
                    });
                } else {
                    showModal("Not Quite ❌", `Hint: ${q.exp || "Check the subject and verb agreement!"}`, "error");
                }
            };

            const nextQuestion = () => {
                if (currentQ < data.length - 1) setCurrentQ(q => q + 1);
                else {
                    if (isFinal) {
                        showModal("Final Challenge Complete! 🏆", "You conquered the Final Descriptive Boss!", "success", onComplete);
                    } else {
                        onComplete();
                    }
                }
            };

            const q = data[currentQ];

                <div className={`flex-1 p-4 md:p-6 flex flex-col items-center justify-center ${isFinal ? 'bg-gradient-to-b from-red-900 to-slate-900' : (world ? world.themeBg : 'bg-slate-800')}`}>

                        </div>

                            <div className="max-w-xs mx-auto mb-5">
                                <TopicIllustration topicId={world.id} className="w-full h-32 rounded-xl" />
                            </div>

                                        {String.fromCharCode(65 + i)}

                                </button>

                        </div>
                    </div>

        // =========================================================================
        // 13. STAGE 4: SENTENCE BUILDER (TOPIC-ALIGNED)
        // =========================================================================
        const ScreenSentenceBuilder = ({ world, onBack, onComplete, showModal }) => {
            const data = world.sentences;
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedWords, setSelectedWords] = useState([]);
            const [availableWords, setAvailableWords] = useState([]);

            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            useEffect(() => {
                setCurrentQ(0);
            }, [world.id]);

            useEffect(() => {
                setAvailableWords(shuffle(data[currentQ].words));
                setSelectedWords([]);
            }, [currentQ, data]);

            const handleSelect = (word, index) => {
                setSelectedWords([...selectedWords, word]);
                setAvailableWords(availableWords.filter((_, i) => i !== index));
            };

            const handleDeselect = (word, index) => {
                setAvailableWords([...availableWords, word]);
                setSelectedWords(selectedWords.filter((_, i) => i !== index));
            };

            const handleCheck = () => {
                const answer = selectedWords.join(" ");
                if (answer === data[currentQ].correct) {
                    showModal("Amazing! ⭐", `Correct sentence:\n"${answer}"`, "success", () => {
                        if (currentQ < data.length - 1) setCurrentQ(q => q + 1);
                        else onComplete();
                    });
                } else {
                    showModal("Not Quite! 🚧", "Check the word order carefully and try again.", "error");
                }
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} flex flex-col items-center justify-center`}>
                    <div className="w-full max-w-3xl mb-3 flex justify-between items-center">

                            </span>

        // =========================================================================
        // 14. STAGE 5: WRITING BUILDER (ASSEMBLE ALL WORD/SENTENCE GROUPS INTO ONE PARAGRAPH BOX!)
        // =========================================================================
        const ScreenWritingBuilder = ({ world, showModal, onBack, onSaveWriting, onComplete }) => {
            const [paragraphText, setParagraphText] = useState(world.identificationIntro + " ");
            const [usedIds, setUsedIds] = useState([]);
            const [showModel, setShowModel] = useState(false);

            useEffect(() => {
                setParagraphText(world.identificationIntro + " ");
                setUsedIds([]);
                setShowModel(false);
            }, [world.id]);

            const addSentenceToBox = (item) => {
                setParagraphText(prev => {
                    const trimmed = prev.trim();
                    return trimmed ? `${trimmed} ${item.text}` : item.text;
                });
                if (!usedIds.includes(item.id)) {
                    setUsedIds(prev => [...prev, item.id]);
                }
            };

            const handleDropIntoParagraph = (e) => {
                e.preventDefault();
                const itemId = e.dataTransfer.getData('text/plain');
                const found = world.sortItems.find(i => i.id === itemId);
                if (found) addSentenceToBox(found);
            };

            const wordCount = paragraphText.trim().split(/\s+/).filter(Boolean).length;

            const handleCheckAndSubmit = () => {
                if (wordCount < 20) {
                    showModal(
                        "Add More Details! ✍️",
                        "Click or drag more phrases from each category group into the paragraph box (at least 20 words).",
                        "info"
                    );
                    return;
                }

                const lower = paragraphText.toLowerCase();
                const hasBe = /\b(is|am|are)\b/.test(lower);
                const hasHave = /\b(has|have|feel|swim|surf|located)\b/.test(lower);

                onSaveWriting(paragraphText);
                showModal(
                    "Wonderful Paragraph! 🌟",
                    `Great job composing a complete descriptive paragraph about ${world.subjectTitle}!\n\nWord count: ${wordCount} words\nGrammar check: ${hasBe && hasHave ? 'Uses To Be & Descriptive Verbs!' : 'Good start!'}\n\nNote: Your final writing is saved and ready for teacher feedback.`,
                    "success",
                    onComplete
                );
            };

            const handleDownload = () => {
                const blob = new Blob([`${world.subjectTitle}\n\n${paragraphText}`], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Descriptive_Text_${world.id}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                            <button onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-2 text-xs md:text-sm">
                                ⬅️ Back to {world.name}
                            </button>
                            <button
                                onClick={() => setShowModel(!showModel)}
                                className="btn-3d btn-purple px-4 py-2 text-xs"
                            >
                                {showModel ? '🙈 Hide Model Text' : '👀 View PPT Model Text'}
                            </button>
                        </div>

                        <div className="game-card p-5 md:p-7 animate-pop space-y-6">
                            <div className="flex flex-col md:flex-row items-center gap-5">
                                <div className="w-full md:w-52 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                                </div>
                                <div>
                                    <span className={`inline-block text-xs font-black px-3 py-1 rounded-full border mb-1 ${world.badgeColor}`}>
                                        ✍️ Writing Builder • {world.subjectTitle}
                                    </span>
                                    <h2 className="text-2xl md:text-3xl font-black text-brand-deep">Build Your Full Paragraph!</h2>
                                    <p className="text-sm font-bold text-slate-600 mt-1">
                                        Click or drag sentences from the categorized groups below into the <strong>Paragraph Box</strong> to create one complete descriptive text. You can also edit and add your own sentences!
                                    </p>
                                </div>
                            </div>

                            {/* Optional Model Text Drawer */}
                            {showModel && (
                                <div className="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 text-sm font-semibold text-purple-950">
                                    <div className="font-black text-purple-800 mb-1">📖 PPT Model Example ({world.subjectTitle}):</div>
                                    <p className="whitespace-pre-line">{world.modelText.identification} {world.modelText.description}</p>
                                </div>
                            )}

                            {/* Categorized Phrase Chips to Click/Drag */}
                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                                {world.categories.map(cat => (
                                    <div key={cat.id} className={`rounded-2xl border-2 overflow-hidden ${cat.color}`}>
                                        <div className={`${cat.headerBg} text-white font-black px-4 py-2 text-sm flex items-center gap-2`}>
                                            <span>{cat.icon}</span> {cat.label} (Click or Drag)
                                        </div>
                                        <div className="p-3 flex flex-wrap gap-2">
                                            {world.sortItems.filter(i => i.category === cat.id).map(item => {
                                                const isUsed = usedIds.includes(item.id);
                                                return (
                                                    <button
                                                        key={item.id}
                                                        type="button"
                                                        draggable
                                                        onDragStart={(e) => e.dataTransfer.setData('text/plain', item.id)}
                                                        onClick={() => addSentenceToBox(item)}
                                                        className={`drag-chip text-xs font-bold px-3 py-1.5 rounded-xl border-2 text-left transition ${
                                                            isUsed
                                                                ? 'bg-green-100 border-green-400 text-green-900'
                                                                : 'bg-white border-slate-200 text-slate-800 hover:border-brand-sky hover:bg-blue-50'
                                                        }`}
                                                    >

                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Single Unified Paragraph Composer Box */}
                            <div
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={handleDropIntoParagraph}
                                className="bg-blue-50/70 rounded-2xl p-4 border-4 border-dashed border-brand-sky"

                                <div className="flex justify-between items-center mb-2">

                                        Words: {wordCount}

                                </div>
                                <textarea

                            </div>

                            {/* Action Buttons */}
                            <div className="flex flex-wrap gap-3 justify-between">
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => { setParagraphText(world.identificationIntro + " "); setUsedIds([]); }}

                                <button onClick={handleCheckAndSubmit} className="btn-3d btn-primary px-8 py-3 text-base flex-1 sm:flex-none">
                                    ✅ CHECK & SAVE PARAGRAPH (+50 Pts)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                    {[
                        { icon: '👩‍🎓', name: 'People Master', check: progress.completed.some(c => c.startsWith('people_')) },
                        { icon: '🐈', name: 'Animal Master', check: progress.completed.some(c => c.startsWith('animals_')) },
                        { icon: '🚗', name: 'Things Master', check: progress.completed.some(c => c.startsWith('things_')) },
                        { icon: '🏖️', name: 'Place Explorer', check: progress.completed.some(c => c.startsWith('place_')) },
                        { icon: '🤝', name: 'Team Champion', check: progress.completed.includes('team_project') },
                        { icon: '👑', name: 'Descriptive Expert', check: progress.completed.includes('final_challenge') }
                    ].map((b, i) => (
                        <div key={i} className={`p-4 rounded-2xl border-2 bg-slate-800 border-slate-600 text-white ${b.check ? 'opacity-100 ring-2 ring-brand-yellow' : 'opacity-35'}`}>
                            <div className="text-3xl mb-1">{b.icon}</div>
                            <div className="font-bold text-xs">{b.name}</div>
                        </div>
                    ))}
                </div>

                <button onClick={onRestart} className="btn-3d bg-white text-brand-deep py-3 px-8 text-lg rounded-full">
                    🔄 Play Again
                </button>
            </div>
        );

        const ScreenTeacherDashboard = ({ onBack }) => {
            const [data, setData] = useState([]);

            useEffect(() => {
                try {
                    const stored = localStorage.getItem('dta_teacher_data');
                    if (stored) setData(JSON.parse(stored));
                } catch (e) {}
            }, []);

            const exportCSV = () => {
                if (data.length === 0) return;
                const headers = ["Student", "Class", "Group", "Points", "Stars", "Confidence", "Date"];
                const rows = data.map(r => [
                    `"${r.user?.name || ''}"`,
                    `"${r.user?.class || ''}"`,
                    `"${r.user?.groupName || ''}"`,
                    r.progress?.points || 0,
                    r.progress?.stars || 0,
                    `"${r.reflection?.confidence || ''}"`,
                    `"${new Date(r.date).toLocaleDateString()}"`
                ].join(","));
                const csv = [headers.join(","), ...rows].join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "descriptive_text_adventure_recap.csv";
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="flex-1 p-6 bg-slate-100 flex flex-col h-full overflow-hidden">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                        <h2 className="text-2xl md:text-3xl font-black text-slate-800">👩‍🏫 Teacher Dashboard</h2>
                        <div className="flex gap-2">
                            <button onClick={exportCSV} disabled={data.length === 0} className="btn-3d btn-success px-4 py-2 text-xs">
                                ⬇️ Download CSV
                            </button>
                            <button onClick={onBack} className="btn-3d bg-slate-300 text-slate-800 border-2 border-slate-400 shadow-[0_4px_0_#94a3b8] px-4 py-2 text-xs">
                                ⬅️ Back to Home
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex-1 overflow-y-auto">
                        <p className="text-xs font-bold text-amber-800 mb-4 bg-amber-50 p-3 rounded-xl border border-amber-200">
                            ℹ️ Note: Student scores and writings are stored locally on this device/browser only.
                        </p>

                        {data.length === 0 ? (
                            <p className="text-center text-slate-500 py-10 font-bold">No completed student sessions recorded yet.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 text-slate-600 text-sm">
                                            <th className="p-3 border-b-2 font-black">Student</th>
                                            <th className="p-3 border-b-2 font-black">Class / Group</th>
                                            <th className="p-3 border-b-2 font-black text-center">Score</th>
                                            <th className="p-3 border-b-2 font-black">Reflection</th>
                                            <th className="p-3 border-b-2 font-black">Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.map((row, i) => (
                                            <tr key={i} className="border-b hover:bg-slate-50 text-sm">
                                                <td className="p-3 font-bold text-slate-800">{row.user?.name}</td>
                                                <td className="p-3 text-slate-600">{row.user?.class || '-'} / {row.user?.groupName || '-'}</td>
                                                <td className="p-3 text-center">
                                                    <span className="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-black">{row.progress?.points} pts</span>
                                                </td>
                                                <td className="p-3">{row.reflection?.confidence || '-'}</td>
                                                <td className="p-3 text-xs text-slate-400">{new Date(row.date).toLocaleDateString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
